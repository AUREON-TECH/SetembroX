<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060a18">
<title>RAIO X • Aguardando aprovação</title>
<link rel="icon" href="./icon.svg">
<link rel="stylesheet" href="./pending.css?v=1">
</head>
<body>
<main class="pending-shell">
  <section class="pending-card">
    <div class="pending-logo"><div class="pending-mark">RX</div><div><b>RAIO X</b><small>STATUS DO ACESSO</small></div></div>
    <div class="pending-icon">⌛</div>
    <span class="eyebrow">SOLICITAÇÃO RECEBIDA</span>
    <h1>Aguardando aprovação</h1>
    <p>Seu acesso foi criado com sucesso. Agora ele está aguardando a aprovação do CEO.</p>
    <div class="pending-account"><small>CONTA</small><b id="pendingEmail">—</b></div>
    <div id="pendingStatus" class="pending-status waiting"><span></span><b>AGUARDANDO APROVAÇÃO DO CEO</b></div>
    <button id="checkApproval" class="primary" type="button">VERIFICAR APROVAÇÃO</button>
    <button id="useOtherAccount" class="secondary" type="button">Usar outro e-mail</button>
    <p class="foot">Assim que for aprovado, você entra com o mesmo e-mail e senha.</p>
  </section>
</main>
<script src="./auth-config.js"></script>
<script src="./pending.js?v=1"></script>
</body>
</html>
