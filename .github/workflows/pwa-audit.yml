name: SETEMBRO X PWA Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pwa-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PWA security and installability
        run: |
          node tests/pwa-audit.mjs
          node tests/ops-dashboard.mjs
